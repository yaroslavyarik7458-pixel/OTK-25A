<!-- ⚡ БЛОК ТЕХНИЧЕСКИХ РАБОТ (ВСТАВИТЬ СРАЗУ ПОСЛЕ <body>) -->
<div id="hub-maintenance-screen">
  <style>
    #hub-maintenance-screen {
      position: fixed; inset: 0; z-index: 99999;
      background: var(--bg, #0b0d13);
      background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.14), transparent 65%);
      color: var(--text, #e2e8f0);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .maint-card {
      width: 100%; max-width: 440px;
      background: linear-gradient(145deg, #171e2e, #111520);
      border: 1px solid var(--border, #202738);
      border-radius: 18px; padding: 22px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      position: relative; overflow: hidden;
    }
    .maint-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .maint-pill {
      background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24; font-size: 10px; font-weight: 800; padding: 4px 9px;
      border-radius: 20px; display: flex; align-items: center; gap: 6px; text-transform: uppercase;
    }
    .maint-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 10px #f59e0b; animation: mPulse 1.5s infinite; }
    @keyframes mPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    
    .maint-title { font-size: 19px; font-weight: 900; color: #fff; margin-bottom: 6px; letter-spacing: 0.2px; }
    .maint-sub { font-size: 12px; color: var(--text-dim, #79879c); line-height: 1.45; margin-bottom: 16px; }
    
    .maint-timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .maint-t-box {
      background: rgba(11, 13, 19, 0.75); border: 1px solid var(--border, #202738);
      border-radius: 10px; padding: 10px 4px; text-align: center;
    }
    .maint-t-val { font-size: 20px; font-weight: 900; color: #93c5fd; font-variant-numeric: tabular-nums; }
    .maint-t-lbl { font-size: 9px; color: var(--text-dim, #79879c); text-transform: uppercase; font-weight: 700; margin-top: 3px; }

    .maint-terminal {
      background: #0b0d13; border: 1px solid var(--border, #202738);
      border-left: 3px solid var(--accent, #3b82f6); border-radius: 8px;
      padding: 10px 12px; font-size: 11px; color: #cbd5e1; margin-bottom: 14px;
    }
    .maint-log-line { color: #4ade80; font-family: monospace; font-weight: 700; margin-top: 4px; display: block; }

    .maint-progress-wrap { height: 6px; background: #0b0d13; border-radius: 6px; overflow: hidden; border: 1px solid var(--border, #202738); }
    .maint-progress-bar {
      height: 100%; width: 68%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
      background-size: 200% 100%; animation: mShimmer 2.5s infinite linear;
    }
    @keyframes mShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .maint-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 10px; color: var(--text-dim, #79879c); }
    .maint-dev-btn { background: transparent; border: 1px dashed #2e3850; color: #64748b; padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: 700; }
    .maint-dev-btn:hover { border-color: var(--accent, #3b82f6); color: #93c5fd; }
  </style>

  <div class="maint-card">
    <div class="maint-top">
      <div class="maint-pill"><span class="maint-dot"></span>Техработы • 5 дней</div>
      <span style="font-size: 11px; font-weight: 800; color: #93c5fd;">25А / 25Б</span>
    </div>

    <div class="maint-title">🛠️ Пересборка ядра Хаба</div>
    <div class="maint-sub">
      Проводим жесткий рефакторинг кода, чиним синхронизацию расписания и полируем новые фичи. Скоро вернемся в строй без багов.
    </div>

    <div class="maint-timer">
      <div class="maint-t-box"><div class="maint-t-val" id="mt-d">05</div><div class="maint-t-lbl">дней</div></div>
      <div class="maint-t-box"><div class="maint-t-val" id="mt-h">00</div><div class="maint-t-lbl">часов</div></div>
      <div class="maint-t-box"><div class="maint-t-val" id="mt-m">00</div><div class="maint-t-lbl">минут</div></div>
      <div class="maint-t-box"><div class="maint-t-val" id="mt-s">00</div><div class="maint-t-lbl">секунд</div></div>
    </div>

    <div class="maint-terminal">
      <div style="color: var(--text-dim); font-size: 10px; text-transform: uppercase; font-weight: 800;">Текущий процесс:</div>
      <span class="maint-log-line" id="mt-log">> Отлов багов в парсере расписания...</span>
    </div>

    <div class="maint-progress-wrap"><div class="maint-progress-bar"></div></div>

    <div class="maint-footer">
      <span>Статус: <b>Модернизация v4.4</b></span>
      <button class="maint-dev-btn" id="mt-dev-bypass">👑 Вход разработчика</button>
    </div>
  </div>

  <script>
    (function() {
      const screen = document.getElementById('hub-maintenance-screen');
      if (sessionStorage.getItem('HUB_MAINT_BYPASS') === '1') {
        screen.remove();
        return;
      }

      // Фиксированная дата окончания: 5 полных дней (до 2 ноября 2026 23:59:59)
      const END_TIME = new Date('2026-11-02T23:59:59').getTime();

      function tick() {
        const diff = Math.max(0, END_TIME - Date.now());
        if (diff <= 0) { screen.remove(); return; }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('mt-d').textContent = String(d).padStart(2, '0');
        document.getElementById('mt-h').textContent = String(h).padStart(2, '0');
        document.getElementById('mt-m').textContent = String(m).padStart(2, '0');
        document.getElementById('mt-s').textContent = String(s).padStart(2, '0');
      }
      tick();
      setInterval(tick, 1000);

      const logs = [
        "> Оптимизация облачного шлюза 25А / 25Б...",
        "> Зачистка фантомных пар и коллизий...",
        "> Калибровка ИИ-синтеза и ГОСТ-шаблонов...",
        "> Перезагрузка модуля Chess Titans...",
        "> Установка патча защиты от отчисления..."
      ];
      let lIdx = 0;
      setInterval(() => {
        lIdx = (lIdx + 1) % logs.length;
        const el = document.getElementById('mt-log');
        if (el) el.textContent = logs[lIdx];
      }, 3200);

      // Секретный вход для тебя, чтобы фиксить сайт вживую
      document.getElementById('mt-dev-bypass').onclick = () => {
        const pass = prompt('Код Директора для обхода техработ:');
        const dirPass = localStorage.getItem('HUB_PASS_DIRECTOR') || 'Yaroslav25a';
        if (pass === dirPass) {
          sessionStorage.setItem('HUB_MAINT_BYPASS', '1');
          screen.remove();
        } else if (pass !== null) {
          alert('Доступ закрыт. Идут техработы.');
        }
      };
    })();
  </script>
</div>
<!-- /КОНЕЦ БЛОКА ТЕХРАБОТ -->
